apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pingvin
  namespace: pingvin
spec:
  interval: 5m
  chart:
    spec:
      chart: pingvin-share
      version: 5.7.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  timeout: 20m
  values:
    ingress:
      main:
        enabled: true
        ingressClassName: external
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-staging
        hosts:
          - host: share.${DOMAIN_0}
    persistence:
      data:
        enabled: true
        mountPath: "/opt/app/backend/data"
        type: nfs
        server: "${NASIP}"
        path: "${SHAREMOUNTPATH}"